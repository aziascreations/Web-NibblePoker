# EN - Privacy

head:
  title: Privacy policy - NibblePoker
  description: Our privacy policy in a clear and easy to understand format.

og:
  title: NibblePoker - Privacy Policy
  description: Our privacy policy in a clear and easy to understand format.

header:
  title: Privacy policy

introduction:
  title: Introduction
  text:
    1: This privacy policy is written in accordance with the 12th and 13th articles of the GDPR.
    2: 'If you wish to consult it, you can do so on the following websites:'

data:
  title: Data collection (Web)
  intro:
    1: This websites only collects data through generic access logs in order to detect and block bad actors from accessing this website.
    2: None of the data collected is used for any other purpose, it is never shared with any other third-party and is never use in any sort of analytics.
  private:
    text:
      1: 'Here is the list of private data being collected:'
    list:
      1: IP address
      2: Browser's User-Agent
  non_private:
    text:
      1: 'And here is the list of non-private data being collected:'
    list:
      1: Requested resource' URI
      2: Date and time
  end:
    1: All aforementioned data is deleted after 7 days.

data_dns:
  title: Data collection (DNS)
  intro:
    1: Our <abbr title="Domain Name Service">DNS</abbr> servers
      collects data through generic access logs in order to detect and block bad actors.
    2: None of the data collected is used for any other purpose,
      it is never shared with any other third-party and is never use in any sort of analytics.
  private:
    text:
      1: 'Here is the list of private data being collected:'
    list:
      1: IP address
  non_private:
    text:
      1: 'And here is the list of non-private data being
        collected:'
    list:
      1: Requested DNS record
      2: Date and time
  end:
    1: All aforementioned data is deleted after 7 days.

update:
  title: Changes to our privacy policy
  intro:
    1: The content of this privacy policy was originally written
      on the 4th of December 2021 and was last updated on the 18th of March 2022.
  history:
    1:
      date: 2021/12/04
      desc:
        1: Original version
    2:
      date: 2022/03/18
      desc:
        1: Changed section on data collection to reflect
          new policy.
        2: Added mention about CloudFlare and linked to their
          privacy policy.
        3: Improved the <i>"Changes to our privacy policy"</i>
          section.
    3:
      date: 2022/09/09
      desc:
        1: Changed references to external services to reflect
          the migration to v6Node.
        '1.1': Added mention about v6Node and linked to their
          privacy policy.
        '1.2': Removed mentions of CloudFlare.
        2: Changed the "Cookies" section to indicate that
          none should be used on public domains.
    4:
      date: 2023/11/11
      desc:
        1: Changed references to external services to reflect
          the migration to IONOS.
        '1.1': Removed mentions of v6Node.
        2: Changed section on data collection to reflect
          new timings & infrastructure.
    5:
      date: 2023/11/30
      desc:
        1: Added a section regarding data collection through
          DNS servers.
        2: Changed references to external services to reflect
          the usage of ChicagoVPS
    6:
      date: 2025/03/30
      desc:
        1: Simplification of the 'Third Parties' section.
        2: Removal of unnecessary mentions of our <abbr title="Virtual Private Server">VPS</abbr> providers.
    7:
      date: 2026/??/??
      desc:
        1: Simplified descriptive text about retention of collected data.
        2: Fixed typos.
  end:
    2: In the event of a change to our privacy policy, you will
      be informed explicitly, and a copy of previous versions of the policy will be available
      through this page.

third:
  title: Third Parties
  intro:
    1: "Our services do not share any data with any third parties whatsoever."

cookies:
  title: Cookies
  intro:
    1: Our websites doesn't use nor store any cookies in your
      browser.



contact:
  title: How to contact us ?
  text:
    1: 'If you wish to contact us for more information regarding
      our privacy policy, please contact us via the form included on the contact page,
      or at the following email address:'

complaint:
  title: How to contact the appropriate authorities ?
  text:
    1: Should you wish to report a complaint or if you feel that
      our privacy policy has not addressed your concern in a satisfactory manner, you
      may contact your national Data Protection Authority (DPA).
    2: 'More information on this procedure can be found on the
      following websites:'

