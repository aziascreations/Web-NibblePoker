# EN - DotNet-ListComPort

meta:
  title: DotNet-ListComPort
  description: A simple CLI tool that can list COM ports with their name, friendly
    name and device name easily and cleanly.

article:
  subtitle: <a href="https://github.com/aziascreations/DotNet-ListComPort" class="font-size-16"><i
    class="fab fa-github"></i> View on GitHub</a>

intro:
  title: Introduction
  p1: A simple CLI tool that can list COM ports with their full name easily and
    cleanly.
  p2: This tool is intended to replace the tedious task of having to use the <code
    class="code">mode</code> command, and the <i>Device Manager</i> to find a newly
    plugged-in device that provides a COM port.
  p3: This version of the program is a complete refactoring of my old <a href="https://github.com/aziascreations/PB-ListComPort">PB-ListComPort</a>
    project that also changes from the proprietary and paid PureBasic language and compiler
    to .NET 6.0.

requirements:
  title: Requirements
  text:
    1: Windows
    1.1: Any CPU architecture
    2: ".NET 6.0"
    2.1: Optional if using the larger "self-contained" builds.

improvements:
  title: Improvements over PB-ListComPort
  text:
    1: Switched from PureBasic to .NET 6.0.
    2: Improved a lot of the program's logic.
    3: Added the <code class="code">-H/--short-help</code> option.
    4: Added support for Windows ARM & ARM64.
    5: Support for running without a console.

usage:
  title: Usage

formatting:
  title: Output formatting

packages:
  title: Packages
  single:
    title: Single Builds
    text:
      p1: Lighter builds that only contain the exe and required licenses.<br>You
        will need to install the <a href="https://dotnet.microsoft.com/en-us/download">.NET
        6.0 Runtime</a>.
  self:
    title: Self-Contained Builds
    text:
      p1: Larger builds that contain the exe and the <a href="https://dotnet.microsoft.com/en-us/download">.NET
        6.0 Runtime</a> as well as the required licenses.
  msi:
    title: MSI Installers
    text:
      p1: Windows installers that contain the relevant "Self-Contained" build
        with an option to automatically update existing installations and add the program
        to the <kbd>%PATH%</kbd>.<br>The install location is <kbd>%ProgramFiles%\NibblePoker\lscom\</kbd>
        and cannot be changed. <i>(This will be possible in future releases)</i>

