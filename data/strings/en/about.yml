header:
  title: About

intro:
  title: Introduction
  text:
    p1:
      l1: Hello there, my name is Herwin Bozet.
      l2: I'm a developer who's spent years working in PureBasic, Python, .NET, C, Win32 APIs, embedded systems, and web development.
    p2:
      l1: I like building things that stay out of the way and minimalistic in logic and code.
      l2: You'll mainly find CLI tools, small libraries, self-hosted services, and electronics projects for everyday or specific needs.
    p3:
      l1: Finally, everything here, this website included, is open-source under permissive OSI-approved licenses or in the public domain.
      l2: It's all built and maintained in my free time, with occasional help from the open-source community.

tenets:
  title: Core Tenets
  politics:
    title: Apolitical code
    text:
      p1:
        l1: Code does not care about feelings, code does not care about wars, and it certainly does not care about your politics.
        l2: Everything I do, and any service I offer, is done in a completely apolitical way.
        l3: If you expect to find socially conscious and engaged software, you can look elsewhere.
      p2:
        l1: During the last couple of years, we've seen many developers and companies take stances that either enshittify their product or endanger their users.
        l2: This is something that has bothered me to no end, and I refuse to take part in that kind of rhetoric.
  independence:
    title: Self-reliance &amp; Independance
  freedom:
    title: Trully free software

financing:
  title: Financing
  text:
    p1:
      l1: This website, as well as the surrounding infrastructure,
        was made to cost as little as possible while not being reliant on any censor-happy
        companies.
      l2: Following my core tenets, I also wanted to retain some sort
        of "technological sovereignty", and therefore refuse to support or use companies
        that actively fight against legal free speech.
    p2:
      l1: The details of the operating costs are provided below to
        illustrate the low price of such independence.
    p3:
      l1: And for those of you who are more motivated, I hope to inspire
        you to at least try this kind of activity.
      l2: It may seem daunting at first, but for a fraction of the
        cost presented here, <b>and with a bit of motivation</b>, you can already accomplish
        a lot of things and gain valuable knowledge for a world as interconnected as ours.
    isp: The main ISP bill isn't accounted for since this could run
      off some random public Wi-Fi.
