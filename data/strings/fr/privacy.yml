# FR - Privacy

head:
  title: Politique de confidentialité - NibblePoker
  description: Notre politique de confidentialité dans un format clair et compréhensible.

og:
  title: NibblePoker - Politique de confidentialité
  description: Notre politique de confidentialité dans un format clair et compréhensible.

header:
  title: Politique de confidentialité

introduction:
  title: Introduction
  text:
    1: La politique de confidentialité ci-présente a été écrite en accord avec les articles 12 et 13 de la RGPD.
    2: 'Si vous souhaitez consulter le texte officiel en question, vous pouvez le faire sur les sites internet suivants :'

contact:
  title: Comment nous contacter ?
  text:
    1: 'Si vous souhaitez nous contacter afin d''obtenir plus d''informations
  concernant notre politique de confidentialité, nous vous recommandons d''utiliser
  le formulaire présent sur la page de contact, ou par courriel à l''adresse suivante:'

complaint:
  title: Comment contacter les autorités compétentes ?
  text:
    1: Dans l'éventualité où vous souhaiteriez déposer une plainte
      pour une quelconque raison en rapport avec notre politique de confidentialité, veuillez
      vous adresser à l'autorité nationale de protection des données (DPA).
    2: 'Les informations concernant cette procédure peuvent être
      trouvées sur les sites internet suivants:'

data:
  title: Collecte de données (Web)
  intro:
    1: Ce site web collecte des données au travers des journaux d'évènements afin de détecter et bloquer de potentiels acteurs malveillants.
    2: Les données collectées ne sont en aucun cas utilisées pour une quelconque autre raison.
  private:
    text:
      1: 'Voici la liste des données personnelles collectées:'
    list:
      1: L'addresse IP source
      2: Le "User-Agent" de votre navigateur internet
  non_private:
    text:
      1: 'Et voici la liste des données non-personnelles collectées:'
    list:
      1: L'URI de la ressource demandée
      2: La date et l'heure
  end:
    1: Toutes les données susmentionnées sont automatiquement supprimées après 7 jours.

data_dns:
  title: Collecte de données (DNS)
  intro:
    1: Nos serveurs <abbr title="Service de nom de domaine">DNS</abbr>
      collectent des données au travers des journaux d'évènements afin de détecter et
      bloquer de potentiels acteurs malveillants.
    2: Les données collectées ne sont en aucun cas utilisées
      pour une quelconque autre raison.
  private:
    text:
      1: 'Voici la liste des données personnelles collectées:'
    list:
      1: L'addresse IP source
  non_private:
    text:
      1: 'Et voici la liste des données non-personnelles
        collectées:'
    list:
      1: L'enregistrement DNS demandée
      2: La date et l'heure
  end:
    1: Toutes les données susmentionnées sont automatiquement supprimées après 7 jours.

update:
  title: Changements à notre politique de confidentialité
  intro:
    1: Le contenu de notre politique de confidentialité a été
      originalement écrit et le 4 décembre 2021 modifié pour la dernière fois le 18 mars
      2022.
  history:
    1:
      date: 2021/12/04
      desc:
        1: Version originale
    2:
      date: 2022/03/18
      desc:
        1: Mise-à-jour de la section sur la collection des
          données.
        2: Ajout d'une mention de CloudFlare et ajout de
          liens vers leur politique de confidentialité.
        3: Amélioration de la section <i>"Changements à notre
          politique de confidentialité"</i>.
    3:
      date: 2022/09/09
      desc:
        1: Changement des références aux services externes
          pour indiquer l'utilisation de v6Node.
        '1.1': Ajout de mentions de v6Node et liens vers leur
          politique de vie confidentialité.
        '1.2': Suppression de mentions de CloudFlare.
        2: Changement de la section "Cookies" afin d'indiquer
          qu'ils ne seront plus utilisés sur les domaines publics.
    4:
      date: 2023/11/11
      desc:
        1: Changement des références aux services externes
          pour indiquer l'utilisation de IONOS.
        '1.1': Suppression de mentions de v6Node.
        2: Changement des temps de traitement et mentions
          de l'infrastructure dans la section <i>"Changements à notre politique de confidentialité"</i>.
    5:
      date: 2023/11/30
      desc:
        1: Ajout de la section sur la collection des données
          par le serveur DNS.
        2: Changement des références aux services externes
          pour indiquer l'utilisation de ChicagoVPS.
    6:
      date: 2025/03/30
      desc:
        1: Simplification de la section 'Organismes tiers'.
        2: Suppression des mentions inutiles de nous fournisseurs de <abbr title="Serveur privé virtuel">VPS</abbr>.
    7:
      date: 2026/??/??
      desc:
        1: Simplification du descriptif de la durrée de rétention des données.
        2: Correction de fautes d'orthographe.
  end:
    2: En cas de changement, vous serez clairement informé et une
      copie des anciennes versions de notre politique sera disponible au travers de cette
      page.

third:
  title: Organismes tiers
  intro:
    1: "Nos services ne partagent aucune donnée avec des tiers, quels qu'ils soient."

cookies:
  title: Cookies de navigation
  intro:
    1: Ce site web n'utilise pas, et ne stocke aucun cookies
      dans votre navigateur internet.