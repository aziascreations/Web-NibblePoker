server {
	listen 80;
	#servername localhost;
	
	# FastCGI configuration
	location / {
		# Set it to the biggest page, and some more.
		#fastcgi_buffering on;
		#fastcgi_buffer_size 64k;
		#fastcgi_busy_buffers_size 256k;
		
		fastcgi_cache off;
		
		# All local
		fastcgi_connect_timeout 1s;
		
		# Unsure on how PB would handle it...
		fastcgi_ignore_client_abort off;
		
		#fastcgi_intercept_errors
		
		fastcgi_keep_conn off;
		fastcgi_limit_rate 0;	
		#fastcgi_max_temp_file_size 64m;
		
		fastcgi_param REQUEST_HOST $host;
		fastcgi_param REQUEST_METHOD  $request_method;
		fastcgi_param REQUEST_URI  $request_uri;
		fastcgi_param REQUEST_PATH  $uri;
		fastcgi_param REQUEST_QUERY  $query_string;
		
		fastcgi_param NP_TEST_01 "Value_NP_TEST_01";
		
		#fastcgi_param QUERY_STRING $query_string;
		
		fastcgi_pass host.docker.internal:5601;
	}
	
	location /resources/ {
		#root /var/www/localhost/resources/;
        alias /var/www/localhost/resources/;
        
        # Cache static resources
        expires 1s;
        #add_header Cache-Control "public, immutable";
        
        # MIME types
        types {
            text/html                   html htm shtml;
            text/css                    css;
            text/xml                    xml;
            image/gif                   gif;
            image/jpeg                  jpeg jpg;
            application/javascript      js;
            application/wasm            wasm;
            text/javascript             mjs;
            application/json            json;
            text/plain                  txt;
            image/png                   png;
            image/svg+xml               svg svgz;
            image/webp                  webp;
            application/x-font-ttf      ttf ttc;
            application/font-woff       woff;
            application/font-woff2      woff2;
        }
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        
        # Gzip compression
        gzip_static on;
        gzip_vary on;
    }
	
}
